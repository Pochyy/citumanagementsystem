spring.application.name=ojtmanagementsystem

# DB connection
spring.datasource.url=jdbc:mysql://localhost:3306/ojtmanagementsystem
spring.datasource.username=root
spring.datasource.password=root

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Creates the verification tables/views/document types when the backend starts.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:verification_tables.sql
spring.sql.init.continue-on-error=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
